<!DOCTYPE html>
<!-- html5 standard -->
<html lang="en">
<head>
  <!-- metadata head section ke liye -->
  <meta charset="UTF-8">

  <!-- viewport mobile responsive design ke liye zaroori hai -->
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <!-- page description jo seo mein aata hai -->
  <meta
    name="description"
    content="Sign in to the CineFlix frontend demonstration."
  >

  <!-- browser tab mein jo title dikhta hai -->
  <title>Sign In | CineFlix</title>

  <!-- google fonts import kar rahe hain -->
  <link rel="preconnect" href="https://fonts.googleapis.com">

  <link
    rel="preconnect"
    href="https://fonts.gstatic.com"
    crossorigin
  >

  <!-- fonts ka actual link -->
  <link
    href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600;700;800&display=swap"
    rel="stylesheet"
  >

  <!-- shared css file jo sab pages mein common styling hai -->
  <link
    rel="stylesheet"
    href="../css/style.css"
  >

  <!-- login page ke liye specific css -->
  <link
    rel="stylesheet"
    href="../css/login.css"
  >
</head>

<body class="login-page">
  <!-- login header jo top mein hota hai -->
  <header class="login-header">
    <!-- home page ke liye link -->
    <a
      href="../index.html"
      class="brand-logo"
      aria-label="Return to CineFlix home"
    >
      CineFlix
    </a>
    <!-- header ke right side mein theme button -->
    <div class="header-right">
      <!-- dark/light mode toggle button -->
      <button id="theme-toggle" class="icon-button theme-button" type="button" aria-label="Switch theme">☼</button>
    </div>
  </header>

  <main class="login-container">
    <!-- login form jo user ke credentials lete hain -->
    <form class="login-card">
      <h1>
        Sign In
      </h1>

      <!-- email input field -->
      <label for="email">
        Email or mobile number
      </label>

      <!-- email ka input jo email format ko validate karta hai -->
      <input
        id="email"
        type="email"
        placeholder="Enter your email"
        autocomplete="email"
        required
      >

      <!-- password field -->
      <label for="password">
        Password
      </label>

      <!-- password input jo text ko hide kar deta hai security ke liye -->
      <input
        id="password"
        type="password"
        placeholder="Enter your password"
        autocomplete="current-password"
        required
      >

      <!-- submit button jo form ko submit karta hai -->
      <button
        class="login-submit"
        type="submit"
      >
        Sign In
      </button>

      <p
        class="form-message"
        aria-live="polite"
      ></p>

      <div class="login-options">
        <label>
          <input type="checkbox">

          Remember me
        </label>

        <a href="#">
          Need help?
        </a>
      </div>

      <p class="signup-text">
        New to CineFlix?

        <a href="signup.html">
          Sign up now.
        </a>
      </p>

      <p class="login-note">
        This is a frontend academic demonstration.
        No real account is created.
      </p>
    </form>
  </main>

  <!-- Shared JavaScript -->
  <script src="../js/app.js"></script>
</body>
</html>
