<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Sign up for the CineFlix frontend demonstration.">
  <title>Sign Up | CineFlix</title>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <!-- Shared CSS -->
  <link rel="stylesheet" href="../css/style.css">
  
  <!-- Login page specific CSS -->
  <link rel="stylesheet" href="../css/login.css">
</head>

<body class="login-page">
  <header class="login-header">
    <a href="../index.html" class="brand-logo" aria-label="Return to CineFlix home">CineFlix</a>
    <div class="header-right">
      <button id="theme-toggle" class="icon-button theme-button" type="button" aria-label="Switch theme">☼</button>
    </div>
  </header>

  <main class="login-container">
    <form class="login-card">
      <h1>Sign Up</h1>

      <label for="username">Username</label>
      <input id="username" type="text" placeholder="Choose a username" required>

      <label for="email">Email</label>
      <input id="email" type="email" placeholder="Enter your email" autocomplete="email" required>

      <label for="password">Password</label>
      <input id="password" type="password" placeholder="Create a password" autocomplete="new-password" required>

      <button class="login-submit" type="submit">Sign Up</button>

      <p class="form-message" aria-live="polite"></p>

      <p class="signup-text">
        Already have an account? <a href="login.html">Sign In.</a>
      </p>

      <p class="login-note">
        This is a frontend academic demonstration. No real account is created.
      </p>
    </form>
  </main>

  <script src="../js/app.js"></script>
</body>
</html>
