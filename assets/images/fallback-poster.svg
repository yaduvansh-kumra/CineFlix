<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 450" width="300" height="450">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1f1c2c"/>
      <stop offset="100%" stop-color="#0f0c1b"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#e50914"/>
      <stop offset="100%" stop-color="#ff3b30"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#e50914" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="300" height="450" fill="url(#bg)"/>
  <circle cx="150" cy="180" r="120" fill="url(#glow)"/>
  
  <!-- Film reel icon -->
  <g transform="translate(110, 120)" fill="none" stroke="#e50914" stroke-width="4">
    <circle cx="40" cy="40" r="36"/>
    <circle cx="40" cy="40" r="14" fill="#e50914"/>
    <circle cx="40" cy="18" r="4" fill="#ffffff"/>
    <circle cx="40" cy="62" r="4" fill="#ffffff"/>
    <circle cx="18" cy="40" r="4" fill="#ffffff"/>
    <circle cx="62" cy="40" r="4" fill="#ffffff"/>
  </g>
  
  <!-- Brand Logo & Placeholder Text -->
  <text x="150" y="240" font-family="'Inter', sans-serif" font-size="22" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="2">CINEFLIX</text>
  <text x="150" y="270" font-family="'Inter', sans-serif" font-size="14" font-weight="600" fill="#e50914" text-anchor="middle" letter-spacing="1">ORIGINAL</text>
  
  <!-- Star Rating -->
  <g transform="translate(110, 295)" fill="#ffb400">
    <polygon points="10,1 4,19 19,7 1,7 16,19"/>
    <polygon points="26,1 20,19 35,7 17,7 32,19"/>
    <polygon points="42,1 36,19 51,7 33,7 48,19"/>
    <polygon points="58,1 52,19 67,7 49,7 64,19"/>
    <polygon points="74,1 68,19 83,7 65,7 80,19"/>
  </g>
  
  <text x="150" y="340" font-family="'Inter', sans-serif" font-size="12" fill="#888888" text-anchor="middle">Ultra HD • 4K • 5.1 Audio</text>
</svg>
